name: Playwright Tests

on:
    push:
        branches: [main, master]
    pull_request:

jobs:
    test:
        name: smoke (chromium)
        runs-on: ubuntu-latest
        timeout-minutes: 30

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: jane_art_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            # Реальная база — сервис-контейнер выше. PgBouncer в CI нет,
            # поэтому DATABASE_URL и DIRECT_URL совпадают.
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jane_art_test
            DIRECT_URL: postgresql://postgres:postgres@localhost:5432/jane_art_test

            # Ключи-заглушки. Их нельзя опустить: `next build` исполняет код
            # верхнего уровня, а `new Stripe(process.env.STRIPE_SECRET_KEY!)`
            # в src/lib/stripe.ts синхронно бросает при пустом ключе — сборка
            # упала бы до первого теста.
            STRIPE_SECRET_KEY: sk_test_ci_placeholder
            STRIPE_PUBLISHABLE_KEY: pk_test_ci_placeholder
            STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder

            BETTER_AUTH_SECRET: ci_placeholder_secret_do_not_use_in_production
            BETTER_AUTH_URL: http://localhost:3000
            NEXT_PUBLIC_APP_URL: http://localhost:3000

            GOOGLE_CLIENT_ID: ci_placeholder
            GOOGLE_CLIENT_SECRET: ci_placeholder

            CRON_SECRET: ci_placeholder

            NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ci_placeholder

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Именно migrate deploy, а не db push: так CI заодно проверяет, что
            # история миграций воспроизводит схему на чистой базе. Если кто-то
            # снова поправит схему пушем мимо миграций — упадёт здесь.
            - name: Apply migrations
              run: npx prisma migrate deploy

            # Каталог и карточка товара в смок-тестах требуют товаров в базе.
            - name: Seed database
              run: npx prisma db seed

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            # Конфиг сам поднимает приложение: npm run build && npm run start.
            - name: Run Playwright tests
              run: npx playwright test

            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
